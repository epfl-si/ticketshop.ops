apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: svc0049p-ticketshop

resources:
  - ../../base

patches:
  - target:
      kind: Route
      name: ticketshop
    patch: |-
      - op: replace
        path: /spec/host
        value: ticketshop.epfl.ch
  - target:
      kind: Deployment
      name: ticketshop
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
  - target:
      kind: PodDisruptionBudget
      name: ticketshop-pdb
    patch: |-
      - op: replace
        path: /spec/minAvailable
        value: 1
  - target:
      kind: AlertmanagerConfig
      name: alertmanager-telegram
    patch: |-
      - op: replace
        path: /spec/receivers/0/telegramConfigs/0/chatID
        value: -4878626685
  - target:
      kind: Probe
      name: ticketshop-probe
    patch: |-
      - op: replace
        path: /spec/targets/staticConfig/static/0
        value: https://ticketshop.epfl.ch
