apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: ticketshop-alerts
  labels:
    app: ticketshop
spec:
  groups:
    - name: ticketshop-pod-alerts
      rules:
        - alert: "TicketshopPodRestartingTooOften"
          expr: >
            increase(kube_pod_container_status_restarts_total{namespace="$(namespace)", pod=~"ticketshop-.*"}[30m]) > 3
          for: 5m
          labels:
            severity: critical
            sendto: telegram
            app: "ticketshop"
          annotations:
            summary: "Ticketshop application pod restarting too often"
            description: >-
              The Ticketshop application pod has restarted more than 3 times in the last 30 minutes.

        - alert: "TicketshopPodMissing"
          expr: >
            absent(kube_pod_info{namespace="$(namespace)", pod=~"ticketshop-.*"}) == 1
          for: 15s
          labels:
            severity: critical
            sendto: telegram
            app: "ticketshop"
          annotations:
            summary: "Ticketshop application pod is missing"
            description: >-
              No Ticketshop application pod is running for more than 15 seconds.

        - alert: "TicketshopPodNotReady"
          expr: >
            sum by (pod) (kube_pod_status_phase{namespace="$(namespace)", pod=~"ticketshop-.*", phase=~"Running|Pending"}) > 0
            and
            sum by (pod) (kube_pod_status_ready{namespace="$(namespace)", pod=~"ticketshop-.*", condition="true"}) == 0
          for: 45s
          labels:
            severity: critical
            sendto: telegram
            app: "ticketshop"
          annotations:
            summary: "Ticketshop application pod is not ready"
            description: >-
              The Ticketshop application pod is running but not ready for more than 45 seconds.

        - alert: "TicketshopHighMemoryUsage"
          expr: >
            (container_memory_usage_bytes{namespace="$(namespace)", pod=~"ticketshop-.*"} / container_spec_memory_limit_bytes{namespace="$(namespace)", pod=~"ticketshop-.*"}) * 100 > 85
          for: 5m
          labels:
            severity: warning
            sendto: telegram
            app: "ticketshop"
          annotations:
            summary: "Ticketshop application pod high memory usage"
            description: >-
              The Ticketshop application pod {{ $labels.pod }} is using more than 85% of its memory limit for more than 5 minutes.

        - alert: "TicketshopHighCPUUsage"
          expr: >
            (rate(container_cpu_usage_seconds_total{namespace="$(namespace)", pod=~"ticketshop-.*"}[5m]) / container_spec_cpu_quota{namespace="$(namespace)", pod=~"ticketshop-.*"} * container_spec_cpu_period{namespace="$(namespace)", pod=~"ticketshop-.*"}) * 100 > 80
          for: 5m
          labels:
            severity: warning
            sendto: telegram
            app: "ticketshop"
          annotations:
            summary: "Ticketshop application pod high CPU usage"
            description: >-
              The Ticketshop application pod {{ $labels.pod }} is using more than 80% of its CPU limit for more than 5 minutes.

        - alert: "TicketshopPodCrashLooping"
          expr: >
            rate(kube_pod_container_status_restarts_total{namespace="$(namespace)", pod=~"ticketshop-.*"}[15m]) > 0
          for: 5m
          labels:
            severity: critical
            sendto: telegram
            app: "ticketshop"
          annotations:
            summary: "Ticketshop application pod is crash looping"
            description: >-
              The Ticketshop application pod {{ $labels.pod }} is in a crash loop, restarting continuously.

        - alert: "TicketshopPodOOMKilled"
          expr: >
            (kube_pod_container_status_last_terminated_reason{namespace="$(namespace)", pod=~"ticketshop-.*", reason="OOMKilled"} == 1)
          for: 1m
          labels:
            severity: critical
            sendto: telegram
            app: "ticketshop"
          annotations:
            summary: "Ticketshop application pod killed due to OOM"
            description: >-
              The Ticketshop application pod {{ $labels.pod }} was killed due to Out Of Memory.

        - alert: "TicketshopPodImagePullError"
          expr: >
            kube_pod_container_status_waiting_reason{namespace="$(namespace)", pod=~"ticketshop-.*", reason=~"ImagePullBackOff|ErrImagePull"} == 1
          for: 5m
          labels:
            severity: warning
            sendto: telegram
            app: "ticketshop"
          annotations:
            summary: "Ticketshop application pod image pull error"
            description: >-
              The Ticketshop application pod {{ $labels.pod }} cannot pull its container image.

        - alert: "TicketshopPodPending"
          expr: >
            kube_pod_status_phase{namespace="$(namespace)", pod=~"ticketshop-.*", phase="Pending"} == 1
          for: 10m
          labels:
            severity: warning
            sendto: telegram
            app: "ticketshop"
          annotations:
            summary: "Ticketshop application pod stuck in pending state"
            description: >-
              The Ticketshop application pod {{ $labels.pod }} has been in pending state for more than 10 minutes.
