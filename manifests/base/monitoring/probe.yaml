apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: ticketshop-probe
spec:
  selector:
    matchLabels:
      app: blackbox-exporter
  endpoints:
    - interval: 30s
      params:
        module:
          - http_2xx
        target:
          - "https://ticketshop.epfl.ch"
      path: /probe
      port: http
      scheme: http
      relabelings:
        - action: replace
          targetLabel: __address__
          replacement: blackbox-service.svc0049p-ticketshop.svc.cluster.local:9115
        - action: replace
          sourceLabels:
            - __param_target
          targetLabel: target_url
        - action: replace
          replacement: services
          targetLabel: ticketshop
