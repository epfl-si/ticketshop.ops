apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: ticketshop-vpa
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ticketshop
  updatePolicy:
    updateMode: "Auto"
  resourcePolicy:
    containerPolicies:
      - containerName: "*"
        maxAllowed:
          memory: 2Gi
        minAllowed:
          cpu: 10m
          memory: 128Mi
        controlledResources: ["cpu", "memory"]
